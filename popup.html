<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Saved practice loops</title><link rel="icon" type="image/png" href="icons/icon-32.png"><link rel="stylesheet" href="popup.css"></head>
<body>
  <header><img src="icons/icon-128.png" width="44" height="44" alt=""><div><h1>Practice Loop</h1><p>Your music practice library</p></div></header>
  <form id="save-form"><label for="name">Save the current YouTube passage</label><div class="save-row"><input id="name" maxlength="100" placeholder="Loop name (optional)"><button type="submit">Save loop</button></div></form>
  <p id="status" role="status" aria-live="polite"></p>
  <label class="search-label" for="search">Saved loops</label><input id="search" type="search" placeholder="Find a video or loop…">
  <main id="library" aria-label="Saved loops"></main>
  <script src="loop-core.js"></script><script src="library.js"></script><script src="popup.js"></script>
</body></html>
